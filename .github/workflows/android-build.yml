name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ghost OS and pinned runtime source
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Rewrite upstream SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Initialize nested upstream source dependencies
        run: git submodule update --init --recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build components
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "cmake;3.22.1"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build PRoot native runtime
        working-directory: third_party/pr
        run: |
          scripts/build.sh --arch=arm64
          scripts/build-pr-cli.sh
          install -Dm755 build/out/arm64/proot android/proot-engine/src/main/jniLibs/arm64-v8a/libproot.so
          install -Dm755 build/out/arm64/loader android/proot-engine/src/main/jniLibs/arm64-v8a/libproot-loader.so
      - name: Build Ghost OS debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-os-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
